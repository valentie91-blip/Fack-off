<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fack Off</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
button,input{font:inherit}
.screen{min-height:100vh;padding:22px 16px 30px;display:flex;flex-direction:column;align-items:center}
h1{font-size:48px;letter-spacing:1px;margin:70px 0 42px}
h2{margin:12px 0 20px}
.btn{width:min(390px,94vw);border:0;border-radius:15px;padding:16px 20px;margin:7px 0;background:#fff;color:#111;font-weight:700;font-size:19px}
.btn.dark{background:#303034;color:#fff}
.input{width:min(390px,94vw);padding:15px;margin:6px 0;border-radius:13px;border:1px solid #555;background:#202023;color:#fff}
.small{font-size:13px;color:#aaa;text-align:center}
.top{width:100%;display:flex;align-items:flex-start;gap:10px}
.backArrow{width:34px;height:34px;padding:0;border:0;border-radius:10px;background:#303034;color:#fff;font-size:28px;line-height:30px;flex-shrink:0}
.top .turn{flex:1}
.turn{font-size:22px;font-weight:800}
.status{font-size:12px;color:#aaa;text-align:right;line-height:1.5}
.board{position:relative;width:min(94vw,650px);height:min(94vw,650px);margin:8px auto}
.card{position:absolute;width:46px;height:68px;border-radius:8px;border:1px solid #777;background:linear-gradient(135deg,#333,#111);box-shadow:0 3px 9px #000;transform:translate(-50%,-50%);cursor:pointer;padding:0}
.card.face{background:#f8f8f8;color:#111;border:2px solid #ddd}
.card .rank{position:absolute;top:3px;left:5px;font-size:11px;font-weight:800}
.card .suit{position:absolute;left:0;right:0;top:20px;text-align:center;font-size:20px}
.red{color:#c22}.black{color:#111}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#777;font-size:13px;pointer-events:none}
.overlay{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:20}
.big{width:min(72vw,300px);height:min(92vw,430px);border-radius:24px;background:#fafafa;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 15px 55px #000}
.big .rank{font-size:78px;font-weight:900}.big .suit{font-size:70px}.big .action{font-size:19px;font-weight:700;text-align:center;padding:18px}
.rules{width:min(720px,96vw);line-height:1.45}.rules h3{margin:20px 0 5px}.rules p{color:#ddd;margin:6px 0}
.list{width:min(500px,94vw)}.choice{width:100%;background:#252527;color:#fff;border:1px solid #444;border-radius:13px;padding:14px;margin:5px 0}.choice.active{border-color:#fff}
.busWrap{width:min(1000px,96vw);margin:8px auto;text-align:center}
.busTitle{font-size:20px;font-weight:800;margin-bottom:10px}
.busRow{display:flex;justify-content:center;align-items:center;gap:8px;min-height:108px;overflow:visible;padding:4px 0}
.bus-card{flex:0 0 72px;width:72px;height:102px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 18px #000}
.bus-card.up{background:#fafafa;color:#111}
.bus-card.down{background:linear-gradient(135deg,#333,#111);border:1px solid #777;color:#aaa;font-size:28px;font-weight:900}
.bus-card.up:first-child{margin-right:12px}
.bus-card.revealed{transform:scale(1.03);transition:transform .2s}
.busScreen .choice{padding:10px;margin:4px 0}
.busScreen .small{margin:6px 0}
.bus-card .rank{font-size:34px;font-weight:900;line-height:1}
.bus-card .suit{font-size:34px;line-height:1;margin-top:5px}

@media (orientation:landscape){
  .busScreen{padding:8px 14px}
  .busScreen .top{margin-bottom:4px}
  .busScreen .busRow{gap:7px}
  .busScreen .bus-card{width:78px;height:108px;flex-basis:78px}
  .busScreen .list{display:flex;justify-content:center;gap:10px}
  .busScreen .choice{width:170px}
}
@media (max-width:900px) and (orientation:landscape){
  .busScreen .bus-card{width:66px;height:92px;flex-basis:66px}
  .busScreen .busRow{gap:5px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SUITS=[["♥","red"],["♦","red"],["♣","black"],["♠","black"]];
const RANKS=["7","8","9","10","B","D","K","A"];
let players=[],current=0,deck=[],revealed=null,kingCount=0,kingHolder=null,activeDame=null;
let loser=null,loserDeck=[],loserCurrent=null,loserCorrect=0,loserUsed=0,loserFreshCards=[],busBusy=false;

function setApp(html){document.getElementById("app").innerHTML=html}
function makeButton(text,fn,dark=false){const b=document.createElement("button");b.className="btn"+(dark?" dark":"");b.textContent=text;b.onclick=fn;return b}

function home(){
 setApp('<div class="screen"><h1>Fack Off</h1><div id="homeButtons"></div><p class="small">Testversion</p></div>');
 const b=document.getElementById("homeButtons");
 b.append(makeButton("Neues Spiel",setup));
 b.append(makeButton("Busfahrer",busfahrerSetup));
 b.append(makeButton("Regeln",showRules,true));
}

function setup(){
 setApp('<div class="screen"><h2>Neues Spiel</h2><p class="small">2–8 Spieler</p><div id="names"></div><div id="start"></div><div id="back"></div></div>');
 const names=document.getElementById("names");
 for(let i=0;i<8;i++){const x=document.createElement("input");x.className="input";x.placeholder="Spieler "+(i+1);x.id="p"+i;if(i>1)x.style.display="none";names.append(x)}
 const row=document.createElement("div");row.className="row";
 for(let n=2;n<=8;n++){const b=document.createElement("button");b.className="choice"+(n===2?" active":"");b.textContent=n+" Spieler";b.onclick=()=>{document.querySelectorAll("#names .input").forEach((x,i)=>x.style.display=i<n?"block":"none");document.querySelectorAll(".choice").forEach(x=>x.classList.remove("active"));b.classList.add("active")};row.append(b)}
 names.prepend(row);
 document.getElementById("start").append(makeButton("Spiel starten",()=>{players=[];for(let i=0;i<8;i++){const x=document.getElementById("p"+i);if(x.style.display!=="none")players.push(x.value.trim()||"Spieler "+(i+1))}startMain()}));
 document.getElementById("back").append(makeButton("Zurück",home,true));
}

function newDeck(){const a=[];for(const r of RANKS)for(const [s,c] of SUITS)a.push({r,s,c,id:Math.random()});return a.sort(()=>Math.random()-.5)}

function startMain(){current=0;deck=newDeck();revealed=null;kingCount=0;kingHolder=null;activeDame=null;renderMain()}

function cardText(c){
 if("789".includes(c.r)){const n=+c.r;return c.c==="red"?n+" Schlücke verteilen":n+" Schlücke selbst"}
 if(c.r==="10")return"FACKOFF – Namensregel";
 if(c.r==="B")return"BUBE – Neue Regel erstellen";
 if(c.r==="D")return"DAME – Daumenspiel";
 if(c.r==="K")return kingCount<4?"KÖNIG – Fragen stellen":"4. KÖNIG – Spiel beendet";
 if(c.r==="A")return c.c==="red"?"4 Schlücke verteilen":"4 Schlücke selbst";
 return"";
}

function renderMain(){
 setApp('<div class="screen"><div class="top"><button class="backArrow" onclick="endGame()">‹</button><div id="turn" class="turn"></div><div id="status" class="status"></div></div><div id="board" class="board"></div><div id="actions"></div></div>');
 document.getElementById("turn").textContent=players[current]+" ist dran";
 document.getElementById("status").innerHTML=(kingHolder?"König – "+kingHolder+"<br>":"")+(activeDame?'<button style="background:none;border:0;color:#aaa;padding:0;font-size:12px" onclick="clearDame()">Dame – '+activeDame+'</button>':"");
 const b=document.getElementById("board"),active=deck.filter(c=>!c.removed),cx=b.clientWidth/2,cy=b.clientHeight/2,rx=b.clientWidth*.39,ry=b.clientHeight*.39;
 active.forEach((c,i)=>{const a=i/active.length*Math.PI*2-Math.PI/2,x=document.createElement("button");x.className="card"+(c===revealed?" face":"");x.style.left=(cx+Math.cos(a)*rx)+"px";x.style.top=(cy+Math.sin(a)*ry)+"px";x.style.transform="translate(-50%,-50%) rotate("+(a*180/Math.PI+90)+"deg)";if(c===revealed)x.innerHTML='<span class="rank">'+c.r+'</span><span class="suit '+c.c+'">'+c.s+'</span>';x.onclick=()=>drawMain(c);b.append(x)});
 const center=document.createElement("div");center.className="center";center.textContent=active.length+" Karten";b.append(center);
 document.getElementById("actions").append(makeButton("Regeln",showRules,true));
}

function endGame(){
 if(confirm("Laufendes Spiel wirklich beenden?")) home();
}

function drawMain(c){
 if(revealed)revealed.removed=true;
 revealed=c;
 if(c.r==="D")activeDame=players[current];
 if(c.r==="K"){kingCount++;kingHolder=players[current]}
 showBig(c,()=>{
   if(c.r==="K"&&kingCount>=4){chooseLoser();return}
   current=(current+1)%players.length;renderMain();
 });
}

function showBig(c,done){
 const o=document.createElement("div");o.className="overlay";
 const b=document.createElement("div");b.className="big";
 b.innerHTML='<div class="rank">'+c.r+'</div><div class="suit '+c.c+'">'+c.s+'</div><div class="action">'+cardText(c)+'</div>';
 o.append(b);document.body.append(o);
 setTimeout(()=>{o.remove();done()},2000);
}

function clearDame(){activeDame=null;renderMain()}

function chooseLoser(){
 setApp('<div class="screen"><h2>Busfahrer</h2><p class="small">Der 4. König ist gezogen. Jetzt wird der Verlierer bestimmt.</p><p class="small">Wer laut der gespielten Bube-Regel verloren hat, spielt Busfahrer.</p><div id="loserList" class="list"></div><div id="back"></div></div>');
 const l=document.getElementById("loserList");
 players.forEach(p=>{
   const b=document.createElement("button");
   b.className="choice";
   b.textContent=p;
   b.onclick=()=>startBusfahrer(p);
   l.append(b);
 });
 document.getElementById("back").append(makeButton("Hauptmenü",home,true));
}

function busfahrerSetup(){
 players=["Busfahrer"];
 startBusfahrer("Busfahrer");
}

function chooseBusfahrerPlayer(){
 setApp('<div class="screen"><h2>Wer fährt Bus?</h2><p class="small">Wähle den Spieler für das Busfahrer-Spiel.</p><div id="busList" class="list"></div><div id="back"></div></div>');
 const l=document.getElementById("busList");
 players.forEach(p=>{
   const b=document.createElement("button");
   b.className="choice";
   b.textContent=p;
   b.onclick=()=>startBusfahrer(p);
   l.append(b);
 });
 document.getElementById("back").append(makeButton("Zurück",home,true));
}

function startBusfahrer(p){
 loser=p;
 loserDeck=newDeck();
 loserCorrect=0;
 loserUsed=0;
 loserCurrent=loserDeck.shift();
 loserUsed=1;
 loserFreshCards=[];
 for(let i=0;i<6 && loserDeck.length;i++) loserFreshCards.push(loserDeck.shift());
 loserUsed+=loserFreshCards.length;
 renderBusfahrer();
}

function busCardHTML(c,faceDown=false){
 if(faceDown) return '<div class="bus-card down">?</div>';
 return '<div class="bus-card up"><div class="rank">'+c.r+'</div><div class="suit '+c.c+'">'+c.s+'</div></div>';
}

function renderBusfahrer(){
 setApp('<div class="screen busScreen"><div class="top"><button class="backArrow" onclick="endGame()">‹</button><div class="turn">Busfahrer</div><div class="status"></div></div><div class="busWrap"><div class="busTitle">Busfahrer</div><div class="busRow" id="busRow"></div></div><p class="small">Hoch oder Tief?</p><div class="list" id="busChoices"></div><p id="busProgress" class="small"></p><div id="busInfo" class="small">Wähle Hoch oder Tief. Danach wird die nächste verdeckte Karte aufgedeckt.</div></div>);
 const row=document.getElementById("busRow");
 row.innerHTML=busCardHTML(loserCurrent,false);
 loserFreshCards.forEach(c=>row.insertAdjacentHTML("beforeend",busCardHTML(c,true)));
 const choices=document.getElementById("busChoices");
 ["Hoch","Tief"].forEach(v=>{
   const b=document.createElement("button");
   b.className="choice";
   b.textContent=v;
   b.onclick=()=>busGuess(v);
   choices.append(b);
 });
 document.getElementById("busProgress").textContent=loserCorrect+" von 6 richtig · "+loserUsed+" von 32 Karten verwendet";
}

function busGuess(g){
 if(busBusy || !loserFreshCards.length) return;
 busBusy=true;

 const row=document.getElementById("busRow");
 const next=loserFreshCards[0];
 const hidden=row.querySelector(".bus-card.down");

 // Reveal the NEXT card in its existing position.
 if(hidden){
   hidden.className="bus-card up revealed";
   hidden.innerHTML=busCardHTML(next,false).replace(/^<div class="bus-card up">|<\/div>$/g,"");
 }

 const choices=document.querySelectorAll("#busChoices button");
 choices.forEach(b=>b.disabled=true);
 document.getElementById("busInfo").textContent="Karte wird aufgedeckt …";

 setTimeout(()=>{
   loserFreshCards.shift();
   loserUsed++;

   const a=value(next.r), b=value(loserCurrent.r);

   if(a===b){
     loserCorrect=0;
     document.getElementById("busInfo").textContent="Gleichstand – 1 Schluck. Die Karte wird ersetzt.";
     if(loserDeck.length){
       loserFreshCards.unshift(loserDeck.shift());
       loserUsed++;
     }
     busBusy=false;
     setTimeout(renderBusfahrer,900);
     return;
   }

   const ok=(g==="Hoch"&&a>b)||(g==="Tief"&&a<b);

   if(ok){
     loserCorrect++;
     loserCurrent=next;
     if(loserCorrect>=6){
       document.getElementById("busInfo").textContent="6 richtige in Folge – Busfahrer geschafft!";
       setTimeout(home,1100);
       return;
     }
     // Keep six face-down cards visible while cards remain.
     if(loserDeck.length){
       loserFreshCards.push(loserDeck.shift());
       loserUsed++;
     }
     document.getElementById("busInfo").textContent="Richtig! Nächste Karte: Hoch oder Tief?";
   }else{
     loserCorrect=0;
     loserCurrent=next;
     document.getElementById("busInfo").textContent="Falsch – 3 Schlücke. Drei neue Karten werden ausgelegt.";
     loserFreshCards=[];
     for(let i=0;i<3 && loserDeck.length;i++){
       loserFreshCards.push(loserDeck.shift());
       loserUsed++;
     }
   }

   busBusy=false;
   setTimeout(renderBusfahrer,900);
 },900);
}

function showRules(){
 setApp('<div class="screen"><div class="rules"><h2>Regelwerk</h2><h3>7 / 8 / 9</h3><p>Rot: Schlücke verteilen. Schwarz: selbst trinken.</p><h3>10 – Fuckoff</h3><p>Wer eine 10 zieht, wird im gesprochenen Spiel „Fuckoff“ genannt. Wer den echten Namen sagt, trinkt selbst.</p><h3>Bube</h3><p>Eine neue Regel für alle erfinden. Bube-Regeln können sich stapeln.</p><h3>Dame</h3><p>Daumenspiel. Nur eine Dame ist aktiv.</p><h3>König</h3><p>Der König stellt Fragen. Wer antwortet, trinkt. Der 4. König beendet das Hauptspiel.</p><h3>Ass</h3><p>Rot: 4 Schlücke verteilen. Schwarz: 4 Schlücke selbst.</p><h3>Busfahrer</h3><p>Der 4. König aktiviert Busfahrer. Der Verlierer spielt mit einem neu gemischten 32-Karten-Deck. Eine Karte liegt offen, sechs Karten liegen verdeckt bereit. Für jede nächste Karte wird Hoch oder Tief geraten. 6 richtige in Folge schaffen. Falsche Ansage: 3 Schlücke und 3 neue Karten werden ausgelegt. Gleichstand: 1 Schluck; die neue Karte bleibt aus dem Deck und die aktuelle Vergleichskarte bleibt bestehen. Alle gespielten Karten bleiben aus dem verfügbaren Deck.</p></div></div>');
 const s=document.querySelector(".screen");s.append(makeButton("Zurück",players.length?renderMain:home,true));
}

home();
</script>
</body>
</html>
